<div id="app">

    <button id="rewardAd" class="primary reward-button">📺 СМОТРЕТЬ РЕКЛАМУ</button>

  </div>
  <button id="startHome" class="primary">▶ НАЧАТЬ ИГРУ</button>

  <div class="home-ad-card"><div id="adLabel" class="ad-label">РЕКЛАМА</div><adsgram-task data-block-id="task-52383" data-debug="true" data-debug-console="false" class="task-ad"></adsgram-task></div>
</section>

<section id="game" class="screen">
