<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fruit Catch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<section id="home" class="screen active">
  <div class="logo">🍓 FRUIT CATCH</div>
  <div class="card">
    <div class="label">ОБЩИЙ СЧЁТ</div>
    <div id="totalScore" class="big">0</div>
    <div id="usd" class="usd">≈ $0.00</div>
  </div>
  <button id="startHome" class="primary">▶ НАЧАТЬ ИГРУ</button>
  <button id="withdraw" class="secondary">💸 ВЫВЕСТИ</button>
  <div id="withdrawInfo" class="hint"></div>
</section>

<section id="game" class="screen">
  <div class="hud">
    <span>Общий счёт: <b id="gameTotal">0</b></span>
    <b>🎯 <span id="roundScore">0</span></b>
  </div>
  <div id="field"></div>
  <button id="endGame" class="end">⏹ ЗАКОНЧИТЬ ИГРУ</button>
</section>

<section id="result" class="screen">
  <div class="card result">
    <div>🎉 ИГРА ОКОНЧЕНА</div>
    <div id="earned" class="big">+0</div>
    <div>очков заработано</div>
    <div id="earnedUsd" class="usd">≈ $0.00</div>
    <button id="again" class="primary">▶ ИГРАТЬ СНОВА</button>
    <button id="homeAgain" class="secondary">⌂ ГЛАВНЫЙ ЭКРАН</button>
  </div>
</section>
</div>
<script src="game.js"></script>
</body>
</html>
